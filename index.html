<!DOCTYPE html>
<html>
<head>
	<title>Idle Grow v0.1</title>
	<script src = "js/script.js"></script>
	<link rel = "stylesheet" href = "css/style.css">
</head>
<body onload = "Init()">

<p class = "totalandbutton" id = "totalandbutton">

	<button class = "growButton" onclick = "Click()">Grow Wheat</button>   
	<label class = "clickandsec" id = "perSecond"> Per Second: 0 </label>
	<label class = "clickandsec" id = "perClick"> Per Click: 1  </label>
	<label class = "total" id = "total">Funds: 0</label>

</p>	

<div class = "clickupgrades">

	<!This is the Hoe>
	<button class = "clickUpgrade" id = "hoe" onclick = "buyClickUpgrade(hoe, this)">
		Hoe (+1/Click) | Price: <span class="price">10</span>
	</button>

	<!This is the Spade>
	<button class = "clickUpgrade" id = "spade" onclick = "buyClickUpgrade(spade, this)">
		Spade (+4/Click) | Price: <span class="price">1000</span>
	</button>

	<!This is the Crook>
	<button class = "clickUpgrade" id = "crook" onclick = "buyClickUpgrade(crook, this)">
		Hoe (+15/Click) | Price: <span class="price">75000</span>
	</button>

	<!This is the Scythe>
	<button class = "clickUpgrade" id = "scythe" onclick = "buyClickUpgrade(scythe, this)">
		Hoe (+100/Click) | Price: <span class="price">100000</span>
	</button>

</div>

</body>
</html>
